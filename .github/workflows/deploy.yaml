name: Deploy application

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to.
        default: development
        required: true
        type: environment
      shared-services-ref:
        description: The branch or tag of the shared services repository to use.
        default: main
        required: false
        type: string

concurrency:
  group: deploy
  queue: max

permissions:
  contents: read

run-name: Build and deploy to ${{ inputs.environment || 'development' }}

jobs:
  build:
    name: Build and publish to ${{ inputs.environment || 'development' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    permissions:
      contents: read
      id-token: write
    env:
      APP_NAME: cfa-ui-components
      ENVIRONMENT: ${{ inputs.environment || 'development' }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: github-actions-${{ github.job }}-${{ github.run_id }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Log into Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: login-ecr
      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }}-web
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Image $IMAGE_TAG already exists, skipping build."
            exit 0
          fi

          docker build --platform linux/amd64 -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
      - name: Update SSM version parameter
        run: |
          aws ssm put-parameter \
            --name "/$APP_NAME/$ENVIRONMENT/web/version" \
            --value "$IMAGE_TAG" \
            --overwrite

  deploy:
    name: Deploy to ${{ inputs.environment || 'development' }}
    needs: build
    uses: codeforamerica/github-actions/.github/workflows/shared-services-container-hosting-deploy.yaml@main
    with:
      application: cfa-ui-components
      environment: ${{ inputs.environment || 'development' }}
      shared-services-ref: ${{ inputs.shared-services-ref }}
    secrets: inherit
